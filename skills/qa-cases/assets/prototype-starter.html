<!doctype html>
<!--
  qa-cases 互動原型模板。
  ─ 平台：<body data-platform="app">（iPhone 17 Pro）或 data-platform="web"（桌面瀏覽器 + 手機兩種檢視，可切換）
  ─ 畫面：在 #screens 內新增 <section class="screen">，每個畫面一個
  ─ 情境示範：在檔案下方 id 為 qa-scenarios 的 JSON 區塊填寫，左側點選情境時右側會自動播放
  左側面板、裝置外框、狀態列、動畫、主題切換都會自動運作。

  畫面屬性：
    data-id="login"            唯一 id
    data-name="登入頁"          顯示名稱
    data-group="主流程"         左側分組
    data-cases="TC-1,TC-3"      對應情境
    data-note="說明文字"        選用：在左側顯示的補充說明
    data-url="/login"          選用（web）：瀏覽器網址列顯示的路徑
    data-status="light"        選用（app）：深色畫面時讓狀態列變白字

  互動屬性（加在任何元素上）：
    data-go="home"             切換到指定畫面（有返回堆疊）
    data-back                  回到上一個畫面
    data-open="sheet-id"       打開 sheet 或 alert（class="sheet" / class="alert"）
    data-close                 關閉目前的 sheet 或 alert
    data-toast="已儲存"         顯示 toast
  輸入框、switch、segmented 可以直接操作；也可以寫 onclick="go('id')"、toast('文字')。
  需要在情境示範前重設自訂狀態時，定義 window.onScenarioReset = () => { … }。

  情境示範格式（qa-scenarios）：
    [{ "id": "TC-2", "title": "錯誤密碼被拒絕", "start": "login", "device": "mobile",
       "steps": [
         { "kind": "given", "text": "我已註冊 \"amy@example.com\"", "actions": [{ "call": "setFails", "args": [0] }] },
         { "kind": "when",  "text": "我以密碼 \"wrong\" 登入",   "actions": [{ "type": "#pw", "text": "wrong" }, { "tap": "#login-btn" }] },
         { "kind": "then",  "text": "顯示 \"帳號或密碼錯誤\"",     "actions": [{ "expect": "#pw-hint" }] }
       ] }]
    actions：go（畫面 id）、type（選擇器 + text）、tap（選擇器）、expect（選擇器，會被標示出來）、wait（毫秒）、call（函式名稱 + args）
    device 只在 web 使用：desktop 或 mobile，省略時沿用目前檢視。
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype</title>
<script>
  (() => {
    let saved = null;
    try { saved = localStorage.getItem('qa-theme'); } catch { /* file:// 可能無法使用 */ }
    const dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  })();
</script>
<style>
  :root {
    /* 左側面板與舞台（審閱工具，跟隨深色／淺色） */
    --ink: #111415; --slate: #34434c; --slate-2: #56656e; --rule: #d3d8d4; --wash: #f3f5f2; --paper: #ffffff;
    --marker: #d4f36b; --marker-soft: #eefac8; --on-marker: #16191a; --stage: #f7f8f6; --dot: #d6dbd7;
    --ui: "Helvetica Neue", -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
    /* 裝置內（產品畫面，永遠是淺色產品 UI） */
    --tint: #0a84ff;
    --ios-bg: #f2f2f7; --ios-card: #ffffff; --ios-label: #000000; --ios-label-2: rgba(60, 60, 67, 0.6);
    --ios-sep: rgba(60, 60, 67, 0.18); --ios-fill: rgba(120, 120, 128, 0.12);
    --ios-red: #ff3b30; --ios-green: #34c759; --ios-orange: #ff9500;
    --ios-font: -apple-system, "SF Pro Text", "SF Pro Display", "PingFang TC", "Noto Sans TC", sans-serif;
  }
  :root[data-theme="dark"] {
    --ink: #e8ecea; --slate: #9fb0b9; --slate-2: #6d7c84; --rule: #262c2e; --wash: #191d1e; --paper: #111415;
    --marker-soft: rgba(212, 243, 107, 0.13); --stage: #0c0e0f; --dot: #1f2426;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: var(--ui); color: var(--ink); background: var(--paper); overflow: hidden; -webkit-font-smoothing: antialiased; }
  .shell { display: grid; grid-template-columns: 340px minmax(0, 1fr); height: 100vh; }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  /* ---------- 左側面板 ---------- */
  .panel { display: flex; flex-direction: column; border-right: 1px solid var(--rule); min-height: 0; background: var(--paper); }
  .panel header { padding: 20px 22px 14px; }
  .panel .eyebrow { font-size: 11px; letter-spacing: 0.06em; color: var(--slate-2); }
  .panel h1 { margin-top: 4px; font-size: 18px; line-height: 1.35; }
  .panel header p { margin-top: 4px; font-size: 12.5px; color: var(--slate); line-height: 1.5; }
  .panel-tabs { display: flex; gap: 20px; padding: 0 22px; border-bottom: 1px solid var(--rule); }
  .panel-tabs button {
    position: relative; padding: 8px 0 10px; border: 0; background: none; font: inherit; font-size: 13.5px; color: var(--slate); cursor: pointer;
  }
  .panel-tabs button.on { color: var(--ink); font-weight: 600; }
  .panel-tabs button.on::after { content: ""; position: absolute; left: -2px; right: -2px; bottom: -1px; height: 4px; background: var(--marker); }
  .panel-tabs .n { font-family: var(--mono); font-size: 11px; color: var(--slate-2); margin-left: 4px; }
  .pane { flex: 1; overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
  .pane[hidden] { display: none; }

  /* 情境清單 */
  .sc { border-bottom: 1px solid var(--rule); }
  .sc > button {
    display: grid; grid-template-columns: 52px 1fr 16px; gap: 6px; align-items: baseline; width: 100%;
    padding: 12px 22px; border: 0; background: none; font: inherit; text-align: left; color: var(--ink); cursor: pointer;
  }
  .sc > button:hover { background: var(--wash); }
  .sc .sid { font-family: var(--mono); font-size: 11.5px; color: var(--slate); }
  .sc .stitle { font-size: 13.5px; line-height: 1.45; }
  .sc .play { font-size: 11px; color: var(--slate-2); }
  .sc.on > button { background: var(--wash); }
  .sc.on .stitle { font-weight: 600; }
  .sc.on .play { color: var(--ink); }
  .steps { list-style: none; padding: 2px 22px 14px 22px; }
  .steps li {
    display: grid; grid-template-columns: 52px 1fr; gap: 6px; padding: 5px 0; font-size: 12.5px; line-height: 1.5; color: var(--slate-2);
    transition: color 0.2s;
  }
  .steps .kw { font-family: var(--mono); font-size: 11px; font-weight: 600; padding-top: 1px; }
  .steps li.done { color: var(--slate); }
  .steps li.done .kw::after { content: " ✓"; color: var(--ink); }
  .steps li.active { color: var(--on-marker); }
  .steps li.active .txt { background: var(--marker); box-shadow: 0 0 0 3px var(--marker); border-radius: 1px; }
  .steps li.active .kw { color: var(--ink); }
  /* 按鈕固定寬度不被擠壓；狀態文字過長時換行到下一行 */
  .sc-actions { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; padding: 0 22px 14px 80px; }
  .sc.no-ui .stitle { color: var(--slate); }
  .sc.no-ui .play { color: var(--slate-2); }
  .sc .reason { margin: 0 22px 14px 80px; font-size: 12.5px; line-height: 1.5; color: var(--slate); }
  .sc-actions .status { flex: 1 1 140px; min-width: 0; font-size: 11.5px; line-height: 1.45; color: var(--slate-2); }
  .steps li { cursor: pointer; border-radius: 4px; margin: 0 -6px; padding-left: 6px; padding-right: 6px; }
  .steps li:hover { background: var(--wash); }
  .steps li:hover .txt { text-decoration: underline; text-decoration-color: var(--slate-2); text-underline-offset: 3px; }
  .empty-pane { padding: 24px 22px; font-size: 12.5px; color: var(--slate); line-height: 1.6; }

  /* 畫面清單 */
  .now { padding: 16px 22px; border-bottom: 1px solid var(--rule); background: var(--wash); }
  .now .where { font-size: 11px; color: var(--slate-2); }
  .now .title { margin-top: 2px; font-size: 16px; font-weight: 600; }
  .now .note { margin-top: 6px; font-size: 12.5px; color: var(--slate); line-height: 1.5; }
  .now .cases { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .now .cases span { font-family: var(--mono); font-size: 11.5px; padding: 1px 7px; border: 1px solid var(--ink); border-radius: 4px; }
  .list { padding: 8px 0 16px; }
  .list .p-group { padding: 14px 22px 6px; font-size: 11px; letter-spacing: 0.06em; color: var(--slate-2); }
  .list button {
    display: flex; align-items: baseline; gap: 10px; width: 100%; padding: 7px 22px; border: 0; background: none;
    font: inherit; font-size: 13.5px; color: var(--slate); text-align: left; cursor: pointer;
  }
  .list button .i { font-family: var(--mono); font-size: 11px; color: var(--slate-2); width: 18px; }
  .list button:hover { color: var(--ink); background: var(--wash); }
  .list button.on { color: var(--ink); font-weight: 600; }
  .list button.on .label { color: var(--on-marker); background: linear-gradient(100deg, transparent 0 1%, var(--marker) 3% 96%, transparent 99%) no-repeat 0 62% / 100% 58%; }
  :root[data-theme="dark"] .list button.on .label { background: var(--marker); padding: 0 4px; border-radius: 2px; }

  .controls { display: flex; gap: 6px; padding: 12px 22px; border-top: 1px solid var(--rule); }
  .pbtn {
    flex: none; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center;
    height: 30px; padding: 0 11px; border: 1px solid var(--rule); border-radius: 6px; background: var(--paper);
    font: inherit; font-size: 12.5px; color: var(--ink); cursor: pointer;
  }
  .pbtn:hover { border-color: var(--ink); }
  .controls .count { margin-left: auto; align-self: center; font-family: var(--mono); font-size: 12px; color: var(--slate-2); }
  .hint { padding: 0 22px 14px; font-size: 11.5px; color: var(--slate-2); }

  /* ---------- 舞台 ---------- */
  .stage {
    position: relative; display: grid; place-items: center; overflow: hidden;
    background-color: var(--stage); background-image: radial-gradient(var(--dot) 1px, transparent 1px); background-size: 18px 18px;
  }
  /* 重置：放在裝置所在的舞台右上角，用圖示表示 */
  .stage-reset {
    position: absolute; top: 16px; right: 16px; z-index: 6; width: 38px; height: 38px; display: grid; place-items: center;
    border: 1px solid var(--rule); border-radius: 50%; background: var(--paper); color: var(--ink); cursor: pointer;
    transition: border-color 0.15s, transform 0.3s;
  }
  .stage-reset svg { width: 18px; height: 18px; }
  .stage-reset:hover { border-color: var(--ink); }
  .stage-reset:active svg { transform: rotate(-120deg); transition: transform 0.25s; }
  .stage-reset::after {
    content: attr(data-tip); position: absolute; top: 50%; right: calc(100% + 8px); transform: translateY(-50%);
    padding: 4px 8px; border-radius: 4px; background: var(--ink); color: var(--paper); font-size: 12px; white-space: nowrap;
    opacity: 0; pointer-events: none; transition: opacity 0.15s;
  }
  .stage-reset:hover::after, .stage-reset:focus-visible::after { opacity: 1; }
  .device-switch {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; padding: 3px;
    border: 1px solid var(--rule); border-radius: 999px; background: var(--paper);
  }
  .device-switch button { height: 28px; padding: 0 14px; border: 0; border-radius: 999px; background: none; font: inherit; font-size: 12.5px; color: var(--slate); cursor: pointer; }
  .device-switch button.on { background: var(--ink); color: var(--paper); }
  .device-switch[hidden] { display: none; }
  .fit { position: absolute; left: 50%; top: 50%; transform-origin: center; }
  .device[hidden] { display: none; }

  /* iPhone 17 Pro */
  .iphone {
    position: relative; width: 430px; height: 902px; padding: 14px; border-radius: 70px;
    background: linear-gradient(145deg, #e4e6e8 0%, #b9bec3 42%, #d8dbde 58%, #a9aeb4 100%);
    box-shadow:
      inset 0 0 0 1px rgba(255, 255, 255, 0.6), inset 0 0 0 2px rgba(0, 0, 0, 0.12),
      0 40px 80px -20px rgba(22, 25, 26, 0.35), 0 12px 24px -8px rgba(22, 25, 26, 0.2);
  }
  .iphone::before { content: ""; position: absolute; inset: 4px; border-radius: 66px; background: #0a0a0b; }
  .btn-side { position: absolute; width: 4px; border-radius: 2px; background: linear-gradient(90deg, #9da2a7, #cfd3d6); }
  .btn-side.l { left: -3px; } .btn-side.r { right: -3px; background: linear-gradient(270deg, #9da2a7, #cfd3d6); }
  .btn-side.action { top: 168px; height: 34px; }
  .btn-side.vol-up { top: 232px; height: 64px; }
  .btn-side.vol-down { top: 310px; height: 64px; }
  .btn-side.power { top: 262px; height: 100px; }
  .btn-side.camera { top: 500px; height: 70px; width: 3px; right: -2px; background: linear-gradient(270deg, #6f757b, #9aa0a6); }
  .display {
    position: relative; width: 402px; height: 874px; border-radius: 56px; overflow: hidden;
    background: var(--ios-bg); font-family: var(--ios-font); color: var(--ios-label); isolation: isolate;
  }
  .island {
    position: absolute; top: 11px; left: 50%; width: 125px; height: 37px; margin-left: -62.5px;
    background: #000; border-radius: 20px; z-index: 50;
  }
  .island::after {
    content: ""; position: absolute; right: 12px; top: 11px; width: 15px; height: 15px; border-radius: 50%;
    background: radial-gradient(circle at 40% 40%, #1f2a3a 0 30%, #0b0d12 60%);
  }
  .statusbar {
    position: absolute; inset: 0 0 auto; height: 54px; z-index: 40; display: flex; align-items: center; justify-content: space-between;
    padding: 4px 34px 0 50px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: #000; pointer-events: none;
  }
  .statusbar .icons { display: flex; align-items: center; gap: 6px; }
  .statusbar svg { display: block; fill: currentColor; }
  .display.light-status .statusbar { color: #fff; }
  .home-indicator {
    position: absolute; bottom: 8px; left: 50%; width: 139px; height: 5px; margin-left: -69.5px;
    border-radius: 3px; background: #000; z-index: 40; pointer-events: none;
  }
  .display.light-status .home-indicator { background: #fff; }

  /* 桌面瀏覽器 */
  .browser {
    width: 1280px; height: 800px; border-radius: 12px; overflow: hidden; background: #fff;
    box-shadow: 0 0 0 1px rgba(22, 25, 26, 0.12), 0 40px 80px -24px rgba(22, 25, 26, 0.35);
    display: flex; flex-direction: column;
  }
  .browser .chrome { display: flex; align-items: center; gap: 14px; height: 44px; padding: 0 16px; background: #f1f2f3; border-bottom: 1px solid #dfe1e3; flex: none; }
  .browser .dots { display: flex; gap: 8px; }
  .browser .dots i { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
  .browser .dots i:nth-child(2) { background: #febc2e; } .browser .dots i:nth-child(3) { background: #28c840; }
  .browser .url {
    flex: 1; max-width: 560px; margin: 0 auto; height: 28px; border-radius: 8px; background: #fff; border: 1px solid #e3e5e7;
    display: flex; align-items: center; justify-content: center; font: 13px var(--ios-font); color: #555;
  }
  .browser .viewport-host { position: relative; flex: 1; min-height: 0; font-family: var(--ios-font); color: var(--ios-label); }

  /* 產品畫面的容器：在手機或瀏覽器之間移動，狀態保留 */
  .viewport-host { container-type: inline-size; container-name: vp; }
  .display .viewport-host { position: absolute; inset: 0; }
  .surface { position: absolute; inset: 0; overflow: hidden; }

  /* ---------- 畫面與轉場 ---------- */
  .screen {
    position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: contain; padding: 54px 0 34px;
    background: var(--ios-bg); display: none; scrollbar-width: none;
  }
  .browser .screen { padding: 0; background: #fff; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.on { display: block; }
  .screen.enter-push { animation: pushIn 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .screen.enter-pop { animation: popIn 0.34s cubic-bezier(0.2, 0.8, 0.2, 1); }
  .browser .screen.enter-push, .browser .screen.enter-pop { animation: fadeIn 0.2s ease-out; }
  @keyframes pushIn { from { transform: translateX(100%); } to { transform: none; } }
  @keyframes popIn { from { transform: translateX(-30%); opacity: 0.6; } to { transform: none; opacity: 1; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .screen.enter-push, .screen.enter-pop { animation: none; } }

  /* 情境示範：點擊位置與預期結果的標示 */
  .tap-dot {
    position: absolute; z-index: 80; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; pointer-events: none;
    background: rgba(212, 243, 107, 0.55); border: 2px solid #16191a; animation: tap 0.5s ease-out forwards;
  }
  @keyframes tap { from { transform: scale(0.4); opacity: 1; } to { transform: scale(1.3); opacity: 0; } }
  .qa-expect { outline: 3px solid #d4f36b !important; outline-offset: 3px; box-shadow: 0 0 0 7px rgba(22, 25, 26, 0.85) !important; border-radius: 8px; transition: outline-offset 0.2s; }

  /* ---------- iOS 元件（可以直接在畫面中使用） ---------- */
  .nav { padding: 6px 16px 8px; }
  .nav .bar { display: flex; align-items: center; justify-content: space-between; height: 44px; }
  .nav .bar button, .nav .bar a { border: 0; background: none; font: inherit; font-size: 17px; color: var(--tint); cursor: pointer; text-decoration: none; }
  .nav .back::before { content: "‹"; font-size: 30px; line-height: 17px; margin-right: 4px; vertical-align: -3px; }
  .nav h1 { font-size: 34px; font-weight: 700; letter-spacing: 0.01em; line-height: 1.2; margin-top: 2px; }
  .nav .title-inline { font-size: 17px; font-weight: 600; }
  .content { padding: 8px 16px 24px; }
  h2 { font-size: 20px; font-weight: 600; margin: 20px 0 8px; }
  p { font-size: 15px; line-height: 1.45; margin-bottom: 8px; }
  .muted { color: var(--ios-label-2); font-size: 13px; }
  .section-label { padding: 18px 16px 6px; font-size: 13px; color: var(--ios-label-2); text-transform: uppercase; }
  .group, .card { background: var(--ios-card); border-radius: 12px; overflow: hidden; margin-bottom: 16px; }
  .card { padding: 14px 16px; }
  .cell {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; padding: 11px 16px;
    font-size: 17px; color: inherit; text-decoration: none; position: relative; background: none; border: 0; width: 100%; text-align: left; font-family: inherit;
  }
  .cell + .cell::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--ios-sep); }
  .cell.link::after { content: "›"; color: rgba(60, 60, 67, 0.3); font-size: 24px; line-height: 1; }
  .cell .detail { color: var(--ios-label-2); font-size: 17px; margin-left: auto; }
  .cell:active { background: #e5e5ea; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .field { display: block; margin-bottom: 12px; }
  .field span { display: block; font-size: 13px; color: var(--ios-label-2); margin: 0 4px 6px; }
  .field input, .field select, .field textarea {
    width: 100%; height: 48px; padding: 0 14px; border: 0; border-radius: 12px; background: var(--ios-card);
    font: inherit; font-size: 17px; color: var(--ios-label); outline: none; box-shadow: inset 0 0 0 1px transparent;
  }
  .field textarea { height: 96px; padding: 12px 14px; resize: none; }
  .field input:focus, .field textarea:focus { box-shadow: inset 0 0 0 2px var(--tint); }
  .field.error input { box-shadow: inset 0 0 0 1.5px var(--ios-red); }
  .field .hint { color: var(--ios-red); font-size: 13px; margin: 6px 4px 0; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border: 0; border-radius: 14px;
    background: var(--tint); color: #fff; font: inherit; font-size: 17px; font-weight: 600; cursor: pointer; transition: transform 0.08s, opacity 0.15s;
  }
  .btn:active { transform: scale(0.98); opacity: 0.85; }
  .btn.block { display: flex; width: 100%; }
  .btn.ghost { background: color-mix(in srgb, var(--tint) 14%, transparent); color: var(--tint); }
  .btn.plain { background: none; color: var(--tint); font-weight: 400; min-height: 44px; }
  .btn.destructive { background: var(--ios-red); }
  .btn[disabled] { background: #d1d1d6; color: #fff; cursor: not-allowed; transform: none; opacity: 1; }
  .badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--ios-fill); color: var(--ios-label-2); }
  .badge.ok { background: rgba(52, 199, 89, 0.16); color: #248a3d; }
  .badge.bad { background: rgba(255, 59, 48, 0.14); color: #d70015; }
  .badge.warn { background: rgba(255, 149, 0, 0.16); color: #c93400; }

  }
  .sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: #c7c7cc; margin: 0 auto 12px; }

    background: rgba(242, 242, 247, 0.96); text-align: center; opacity: 0; transform: scale(1.1); pointer-events: none; transition: opacity 0.2s, transform 0.2s;
  }
  .alert.on { opacity: 1; transform: none; pointer-events: auto; }

  .alert .actions button + button { border-left: 0.5px solid var(--ios-sep); font-weight: 600; }

  .toast.on { opacity: 1; transform: translate(-50%, 0); }


  /* ---------- 網頁元件（data-platform="web"；依容器寬度自動切換桌面／手機版面） ---------- */

<script>
  const $ = (id) => document.getElementById(id);
  const body = document.body;
  const platform = body.dataset.platform === 'web' ? 'web' : 'app';
  const surface = $('surface');
  const screensRoot = $('screens');
  const pristine = screensRoot.innerHTML;
  let screens = [];
  let index = -1;
  let backStack = [];
  let device = platform === 'web' ? 'desktop' : 'mobile';

  // ---------- 主題（跟隨審閱頁） ----------
  window.addEventListener('message', (e) => {
    if (e.data && (e.data.qaTheme === 'dark' || e.data.qaTheme === 'light')) document.documentElement.dataset.theme = e.data.qaTheme;
  });

  // ---------- 裝置 ----------
  const fit = () => {
    const stage = $('stage');
    const box = device === 'desktop' ? { w: 1280, h: 800 } : { w: 430, h: 902 };
    const top = platform === 'web' ? 64 : 0;
    const scale = Math.min(1, (stage.clientHeight - 48 - top) / box.h, (stage.clientWidth - 48) / box.w);
    $('fit').style.transform = `translate(-50%, calc(-50% + ${top / 2}px)) scale(${Math.max(0.3, scale)})`;
  };
  const setDevice = (next) => {
    device = platform === 'web' ? next : 'mobile';
    $('phone').hidden = device !== 'mobile';
    $('browser').hidden = device !== 'desktop';
    (device === 'desktop' ? $('browser-host') : $('phone-host')).appendChild(surface);
    document.querySelectorAll('#device-switch button').forEach((b) => b.classList.toggle('on', b.dataset.device === device));
    fit();
  };

  // ---------- 畫面 ----------
  const collectScreens = () => { screens = [...screensRoot.querySelectorAll(':scope > .screen')]; };

  function closeOverlays() {
    surface.querySelectorAll('.sheet.on, .alert.on').forEach((el) => el.classList.remove('on'));
    $('scrim').classList.remove('on');
  }

  function show(i, motion = 'push') {
    const next = (i + screens.length) % screens.length;
    if (next === index && motion !== 'force') return;
    closeOverlays();
    screens.forEach((s) => s.classList.remove('on', 'enter-push', 'enter-pop'));
    const screen = screens[next];
    screen.classList.add('on');
    if (motion === 'push' || motion === 'pop') screen.classList.add(motion === 'pop' ? 'enter-pop' : 'enter-push');
    screen.scrollTop = 0;
    index = next;
    $('display').classList.toggle('light-status', screen.dataset.status === 'light');
    $('url').textContent = `${location.hostname || 'example.com'}${screen.dataset.url || `/${screen.dataset.id}`}`;

    navButtons.forEach((b, n) => b && b.classList.toggle('on', n === index));
    $('p-where').textContent = screen.dataset.group || '';
    $('p-name').textContent = screen.dataset.name || screen.dataset.id;
    $('p-note').hidden = !screen.dataset.note;
    $('p-note').textContent = screen.dataset.note || '';
    $('p-cases').replaceChildren(...(screen.dataset.cases || '').split(',').map((c) => c.trim()).filter(Boolean).map((c) => {
      const tag = document.createElement('span');
      tag.textContent = c;
      return tag;
    }));
    $('p-count').textContent = `${index + 1} / ${screens.length}`;
  }

  window.go = (id) => {
    const i = screens.findIndex((s) => s.dataset.id === id);
    if (i < 0) return;
    backStack.push(index);
    show(i, 'push');
  };
  window.back = () => { if (backStack.length) show(backStack.pop(), 'pop'); };
  let toastTimer = null;
  window.toast = (text) => {
    const el = $('toast');
    el.textContent = text;
    el.classList.add('on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('on'), 1800);
  };
  window.openOverlay = (id) => {
    const el = document.getElementById(id);
    if (!el) return;
    // sheet 與 alert 移到 surface 之下，才能蓋住整個畫面
    if (el.parentElement !== surface) surface.appendChild(el);
    $('scrim').classList.add('on');
    el.classList.add('on');
  };

  // ---------- 畫面內的互動 ----------
  surface.addEventListener('click', (e) => {
    const el = e.target.closest('[data-go], [data-back], [data-open], [data-close], [data-toast], .segmented button');
    if (!el) return;
    if (el.matches('.segmented button')) el.parentElement.querySelectorAll('button').forEach((b) => b.classList.toggle('on', b === el));
    if (el.dataset.toast) toast(el.dataset.toast);
    if ('close' in el.dataset) closeOverlays();
    if (el.dataset.open) { e.preventDefault(); openOverlay(el.dataset.open); }
    if ('back' in el.dataset) { e.preventDefault(); back(); }
    if (el.dataset.go) { e.preventDefault(); go(el.dataset.go); }
  });
  $('scrim').addEventListener('click', closeOverlays);

  // ---------- 左側：畫面清單 ----------
  const navButtons = [];
  const buildScreenList = () => {
    $('p-list').replaceChildren();
    [...new Set(screens.map((s) => s.dataset.group || ''))].forEach((group) => {
      if (group) {
        const g = document.createElement('div');
        g.className = 'p-group';
        g.textContent = group;
        $('p-list').appendChild(g);
      }
      screens.forEach((screen, i) => {
        if ((screen.dataset.group || '') !== group) return;
        const b = document.createElement('button');
        b.type = 'button';
        b.innerHTML = `<span class="i">${String(i + 1).padStart(2, '0')}</span><span class="label"></span>`;
        b.querySelector('.label').textContent = screen.dataset.name || screen.dataset.id;
        b.addEventListener('click', () => { stopDemo(); backStack = []; show(i, 'none'); });
        $('p-list').appendChild(b);
        navButtons[i] = b;
      });
    });
    $('n-screens').textContent = screens.length;
  };

  // ---------- 左側：情境示範 ----------
  let scenarios = [];
  try { scenarios = JSON.parse($('qa-scenarios').textContent || '[]'); } catch { scenarios = []; }
  const KW = { given: 'Given', when: 'When', then: 'Then' };
  let run = 0;
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

  const resetScreens = () => {
    surface.querySelectorAll(':scope > .sheet, :scope > .alert').forEach((el) => el.remove());
    closeOverlays();
    screensRoot.innerHTML = pristine;
    collectScreens();
    backStack = [];
    index = -1;
    if (typeof window.onScenarioReset === 'function') window.onScenarioReset();
  };

  const scale = () => surface.getBoundingClientRect().width / surface.offsetWidth || 1;
  const find = (selector) => surface.querySelector(selector);
  // 只捲動指定的容器；原生 scrollIntoView 會連外層頁面（嵌入審閱頁時的整個瀏覽器視窗）一起捲動
  const scrollWithin = (container, el, { align = 'center', margin = 12 } = {}) => {
    if (!container || !el) return;
    const ratio = container.getBoundingClientRect().height / container.clientHeight || 1;
    const box = container.getBoundingClientRect();
    const rect = el.getBoundingClientRect();
    const top = (rect.top - box.top) / ratio;
    const bottom = (rect.bottom - box.top) / ratio;
    if (align === 'nearest' && top >= margin && bottom <= container.clientHeight - margin) return;
    const target = align === 'start'
      ? container.scrollTop + top - margin
      : align === 'nearest'
        ? container.scrollTop + (top < margin ? top - margin : bottom - container.clientHeight + margin)
        : container.scrollTop + top - (container.clientHeight - (bottom - top)) / 2;
    container.scrollTo({ top: Math.max(0, target), behavior: 'smooth' });
  };
  const reveal = (el) => scrollWithin(el.closest('.screen'), el, { align: 'nearest', margin: 80 });

  const tapAt = (el) => {
    const s = surface.getBoundingClientRect();
    const r = el.getBoundingClientRect();
    const dot = document.createElement('span');
    dot.className = 'tap-dot';
    dot.style.left = `${(r.left + r.width / 2 - s.left) / scale()}px`;
    dot.style.top = `${(r.top + r.height / 2 - s.top) / scale()}px`;
    surface.appendChild(dot);
    setTimeout(() => dot.remove(), 600);
  };

  // fast = true：跳到某一步時，前面的步驟不播動畫、直接完成
  const ACTIONS = {
    go: async (a, token, fast) => {
      if (fast) { const i = screens.findIndex((sc) => sc.dataset.id === a.go); if (i >= 0) { backStack.push(index); show(i, 'none'); } return; }
      window.go(a.go); await sleep(450);
    },
    wait: async (a, token, fast) => { if (!fast) await sleep(Number(a.wait) || 500); },
    call: async (a, token, fast) => { if (typeof window[a.call] === 'function') window[a.call](...(a.args ?? [])); if (!fast) await sleep(250); },
    type: async (a, token, fast) => {
      const el = find(a.type);
      if (!el) return;
      const text = String(a.text ?? '');
      if (fast) { el.value = text; el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); return; }
      reveal(el);
      el.focus({ preventScroll: true });
      el.value = '';
      for (const ch of text) {
        if (token !== run) return;
        el.value += ch;
        el.dispatchEvent(new Event('input', { bubbles: true }));
        await sleep(70);
      }
      el.dispatchEvent(new Event('change', { bubbles: true }));
      await sleep(250);
    },
    tap: async (a, token, fast) => {
      const el = find(a.tap);
      if (!el) return;
      if (fast) {
        // 關掉推入動畫，避免快轉時畫面閃動
        el.click();
        screens.forEach((sc) => sc.classList.remove('enter-push', 'enter-pop'));
        return;
      }
      reveal(el);
      await sleep(250);
      if (token !== run) return;
      tapAt(el);
      await sleep(180);
      el.click();
      await sleep(500);
    },
    expect: async (a, token, fast) => {
      if (fast) return;
      const el = find(a.expect);
      if (!el) return;
      reveal(el);
      el.classList.add('qa-expect');
      await sleep(1100);
    }
  };
  const actionOf = (a) => Object.keys(ACTIONS).find((k) => k in a);

  const renderScenarioList = () => {
    const pane = $('pane-scenarios');
    $('n-scenarios').textContent = scenarios.length;
    const playable = scenarios.filter((sc) => !sc.noUi).length;
    $('n-scenarios').title = `可示範 ${playable} 個，沒有畫面 ${scenarios.length - playable} 個`;
    if (scenarios.length === 0) {
      pane.innerHTML = '<p class="empty-pane">這個原型還沒有情境示範。在 qa-scenarios 加上情境後，點選即可自動播放。</p>';
      return;
    }
    pane.replaceChildren(...scenarios.map((sc, i) => {
      const item = document.createElement('div');
      item.className = 'sc';
      item.innerHTML = `<button type="button"><span class="sid"></span><span class="stitle"></span><span class="play">▶</span></button>`;
      item.querySelector('.sid').textContent = sc.id;
      item.querySelector('.stitle').textContent = sc.title || '';
      if (sc.noUi) {
        // 沒有畫面可以示範的情境：列出來並說明原因，點擊只展開說明
        item.classList.add('no-ui');
        item.querySelector('.play').textContent = '—';
        item.querySelector('button').addEventListener('click', () => {
          stopDemo();
          const open = item.classList.toggle('on');
          document.querySelectorAll('.sc').forEach((el) => {
            if (el !== item) { el.classList.remove('on'); el.querySelector('.steps')?.remove(); el.querySelector('.sc-actions')?.remove(); }
          });
          item.querySelector('.reason')?.remove();
          if (open) {
            requestAnimationFrame(() => scrollWithin($('pane-scenarios'), item, { align: 'nearest', margin: 8 }));
            const note = document.createElement('p');
            note.className = 'reason';
            note.textContent = `沒有畫面可以示範：${sc.reason || ''}`;
            item.appendChild(note);
          }
        });
        return item;
      }
      item.querySelector('button').addEventListener('click', () => {
        // 正在播放的情境：再點一次就停止
        const status = item.querySelector('.sc-actions .status');
        if (item.classList.contains('on') && status?.dataset.state === 'playing') stopDemo();
        else playScenario(i);
      });
      return item;
    }));
  };

  const stopDemo = () => {
    run += 1;
    document.querySelectorAll('.sc').forEach((el) => {
      el.querySelector('.play').textContent = '▶';
      const btn = el.querySelector('.sc-actions .toggle');
      if (btn) btn.textContent = '重新播放';
      const status = el.querySelector('.sc-actions .status');
      if (status && status.dataset.state === 'playing') { status.textContent = '已停止，可以點任一步驟從那裡播放'; status.dataset.state = 'stopped'; }
      el.querySelectorAll('.steps li.active').forEach((li) => li.classList.remove('active'));
    });
  };

  // 展開情境的步驟清單（每一步都可以點擊，從該步驟開始播放）
  const expandScenario = (i) => {
    const sc = scenarios[i];
    document.querySelectorAll('.sc').forEach((el, n) => {
      el.classList.toggle('on', n === i);
      if (n !== i) { el.querySelector('.steps')?.remove(); el.querySelector('.sc-actions')?.remove(); }
    });
    const item = document.querySelectorAll('.sc')[i];
    if (item.querySelector('.steps')) return item;
    let prevKind = null;
    const list = document.createElement('ol');
    list.className = 'steps';
    (sc.steps ?? []).forEach((step, n) => {
      const li = document.createElement('li');
      const kw = step.kind === prevKind ? 'And' : (KW[step.kind] ?? step.kind);
      prevKind = step.kind;
      li.innerHTML = '<span class="kw"></span><span class="txt"></span>';
      li.querySelector('.kw').textContent = kw;
      li.querySelector('.txt').textContent = step.text ?? '';
      li.title = '從這一步開始播放';
      li.addEventListener('click', () => playScenario(i, n));
      list.appendChild(li);
    });
    const actions = document.createElement('div');
    actions.className = 'sc-actions';
    actions.innerHTML = '<button type="button" class="pbtn toggle"></button><span class="status"></span>';
    actions.querySelector('.toggle').addEventListener('click', () => {
      if (actions.querySelector('.status').dataset.state === 'playing') stopDemo();
      else playScenario(i);
    });
    item.append(list, actions);
    return item;
  };

  async function playScenario(i, fromStep = 0) {
    const sc = scenarios[i];
    stopDemo();
    const token = run;
    const item = expandScenario(i);
    // 等收合其他情境的版面變化完成，再把選中的情境捲到左側清單頂端
    requestAnimationFrame(() => scrollWithin($('pane-scenarios'), item, { align: 'start', margin: 8 }));
    const rows = [...item.querySelectorAll('.steps li')];
    const status = item.querySelector('.sc-actions .status');
    const toggle = item.querySelector('.sc-actions .toggle');
    item.querySelector('.play').textContent = '■';
    toggle.textContent = '停止';
    status.textContent = '示範中…';
    status.dataset.state = 'playing';

    if (sc.device) setDevice(sc.device);
    resetScreens();
    const start = Math.max(0, screens.findIndex((s) => s.dataset.id === sc.start));
    show(start, 'force');

    // 跳到指定步驟：前面的步驟直接完成
    const steps = sc.steps ?? [];
    for (const [n, step] of steps.slice(0, fromStep).entries()) {
      rows[n]?.classList.add('done');
      for (const action of step.actions ?? []) {
        const kind = actionOf(action);
        if (kind) await ACTIONS[kind](action, token, true);
      }
    }
    rows.forEach((row, k) => { row.classList.toggle('done', k < fromStep); row.classList.remove('active'); });
    await sleep(fromStep ? 250 : 500);

    for (let n = fromStep; n < steps.length; n += 1) {
      if (token !== run) return;
      rows.forEach((row, k) => { row.classList.toggle('active', k === n); row.classList.toggle('done', k < n); });
      scrollWithin($('pane-scenarios'), rows[n], { align: 'nearest', margin: 48 });
      surface.querySelectorAll('.qa-expect').forEach((el) => el.classList.remove('qa-expect'));
      await sleep(350);
      for (const action of steps[n].actions ?? []) {
        if (token !== run) return;
        const kind = actionOf(action);
        if (kind) await ACTIONS[kind](action, token, false);
      }
      await sleep(450);
    }
    if (token !== run) return;
    rows.forEach((row) => { row.classList.remove('active'); row.classList.add('done'); });
    item.querySelector('.play').textContent = '▶';
    toggle.textContent = '重新播放';
    status.textContent = '示範完成，可以繼續自由操作';
    status.dataset.state = 'done';
  }

  // ---------- 面板分頁與控制 ----------
  const showPane = (name) => {
    document.querySelectorAll('.panel-tabs button').forEach((b) => b.classList.toggle('on', b.dataset.pane === name));
    $('pane-scenarios').hidden = name !== 'scenarios';
    $('pane-screens').hidden = name !== 'screens';
  };
  document.querySelectorAll('.panel-tabs button').forEach((b) => b.addEventListener('click', () => showPane(b.dataset.pane)));
  document.querySelectorAll('#device-switch button').forEach((b) => b.addEventListener('click', () => setDevice(b.dataset.device)));
  $('p-prev').addEventListener('click', () => { stopDemo(); show(index - 1, 'pop'); });
  $('p-next').addEventListener('click', () => { stopDemo(); show(index + 1, 'push'); });
  // 重置：停止示範與輪播，清除所有輸入與狀態，回到第一個畫面（不需要重新整理頁面）
  const resetAll = () => {
    stopDemo();
    document.querySelectorAll('.sc').forEach((el) => {
      el.classList.remove('on');
      el.querySelector('.steps')?.remove();
      el.querySelector('.sc-actions')?.remove();
      el.querySelector('.play').textContent = '▶';
    });
    surface.querySelectorAll('.tap-dot').forEach((el) => el.remove());
    $('toast').classList.remove('on');
    resetScreens();
    show(0, 'force');
  };
  $('p-reset').addEventListener('click', resetAll);
  document.addEventListener('keydown', (e) => {
    if (e.target.matches('input, textarea, select')) return;
    if (e.key === 'ArrowRight') { stopDemo(); show(index + 1, 'push'); }
    if (e.key === 'ArrowLeft') { stopDemo(); show(index - 1, 'pop'); }
    if (e.key === 'Escape') closeOverlays();
    if (e.key === 'r' || e.key === 'R') resetAll();
  });
  window.addEventListener('resize', fit);

  // ---------- 初始化 ----------
  $('p-title').textContent = body.dataset.title || '';
  $('p-subtitle').textContent = body.dataset.subtitle || '';
  $('p-eyebrow').textContent = platform === 'web' ? '互動原型 · 網頁（桌面／手機）' : '互動原型 · iPhone 17 Pro';
  $('device-switch').hidden = platform !== 'web';
  collectScreens();
  buildScreenList();
  renderScenarioList();
  showPane(scenarios.length ? 'scenarios' : 'screens');
  setDevice(device);
  show(0, 'none');
</script>
</body>
</html>
